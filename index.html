<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JaseChat — 5 языков</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e6f0ff 0%, #f0f4ff 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 0;
            margin: 0;
        }

        .chat-container {
            max-width: 100%;
            width: 100%;
            height: 100vh;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border-radius: 0;
            box-shadow: none;
            padding: 20px 40px 20px;
            display: flex;
            flex-direction: column;
            border: none;
            position: relative;
        }

        .lang-selector {
            position: absolute;
            top: 20px;
            right: 40px;
            z-index: 50;
            display: flex;
            gap: 4px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(8px);
            padding: 4px 6px;
            border-radius: 30px;
            border: 1px solid rgba(30, 60, 180, 0.08);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
            flex-wrap: wrap;
            justify-content: flex-end;
            max-width: 400px;
        }

        .lang-selector button {
            background: transparent;
            border: none;
            padding: 3px 8px;
            border-radius: 20px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #6a7a9a;
            font-weight: 500;
            white-space: nowrap;
        }

        .lang-selector button:hover {
            background: rgba(26, 74, 154, 0.06);
            color: #1a3a8a;
        }

        .lang-selector button.active {
            background: linear-gradient(135deg, #1a4a9a, #2a5aaa);
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(26, 74, 154, 0.2);
        }

        .mode-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px 16px;
            padding-bottom: 16px;
            border-bottom: 1.5px solid rgba(30, 60, 180, 0.15);
            margin-bottom: 16px;
            padding-right: 160px;
        }

        .mode-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .mode-bar .title {
            font-size: 21px;
            font-weight: 700;
            color: #1a3a8a;
            background: linear-gradient(135deg, #1a4a9a, #2a5aaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .new-chat-icon {
            width: 42px;
            height: 42px;
            min-width: 42px;
            border-radius: 50%;
            border: 2px solid rgba(30, 60, 180, 0.2);
            background: linear-gradient(135deg, #1a4a9a, #2a5aaa);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(26, 74, 154, 0.2);
            padding: 0;
        }

        .new-chat-icon svg {
            width: 24px;
            height: 24px;
            fill: #ffffff;
        }

        .mode-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .mode-btn {
            background: rgba(30, 60, 180, 0.06);
            border: 1px solid rgba(30, 60, 180, 0.12);
            border-radius: 24px;
            padding: 8px 22px;
            font-size: 17px;
            color: #1a3a8a;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #1a4a9a, #2a5aaa);
            color: #ffffff;
            border-color: transparent;
            box-shadow: 0 4px 15px rgba(26, 74, 154, 0.3);
        }

        .checks {
            display: flex;
            gap: 18px;
            font-size: 16px;
            color: #1a3a8a;
            margin-left: 0;
            margin-right: auto;
        }

        .checks label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .checks input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #1a4a9a;
            cursor: pointer;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding-right: 8px;
            margin-bottom: 8px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .messages::-webkit-scrollbar {
            width: 6px;
        }

        .messages::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #1a4a9a, #2a5aaa);
            border-radius: 10px;
        }

        .messages .message-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 80%;
            animation: fadeIn 0.3s ease;
        }

        .messages .message-wrapper.user {
            align-self: flex-end;
            align-items: flex-end;
        }

        .messages .message-wrapper.jasechat {
            align-self: flex-start;
            align-items: flex-start;
        }

        .messages .message {
            padding: 18px 24px;
            border-radius: 24px;
            line-height: 1.7;
            word-wrap: break-word;
            font-size: 19px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            width: 100%;
        }

        .message-wrapper.user .message {
            background: linear-gradient(135deg, #1a4a9a, #2a5aaa);
            color: #ffffff;
            border-bottom-right-radius: 6px;
            box-shadow: 0 4px 15px rgba(26, 74, 154, 0.2);
        }

        .message-wrapper.jasechat .message {
            background: rgba(30, 60, 180, 0.06);
            color: #1a1a2e;
            border-bottom-left-radius: 6px;
            border: 1px solid rgba(30, 60, 180, 0.08);
        }

        .sources-section {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(30, 60, 180, 0.1);
        }

        .sources-label {
            font-size: 14px;
            font-weight: 600;
            color: #4a3a8a;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sources-label span {
            background: linear-gradient(135deg, #1a4a9a, #6a4ac0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .sources-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 12px;
        }

        .source-link {
            display: inline-block;
            padding: 6px 18px;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 500;
            color: #ffffff !important;
            text-decoration: none !important;
            background: linear-gradient(135deg, #1a4a9a, #5a3aaa);
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(26, 74, 154, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
        }

        .source-link:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 6px 25px rgba(26, 74, 154, 0.4);
            background: linear-gradient(135deg, #2a5aaa, #6a4ac0);
        }

        .source-link:active {
            transform: scale(0.95);
        }

        .source-link .source-icon {
            margin-right: 4px;
            font-size: 13px;
        }

        .message-time {
            font-size: 13px;
            color: #8a9aba;
            margin-top: 6px;
            padding: 0 4px;
            opacity: 0.7;
        }

        .typing-cursor {
            display: inline-block;
            width: 2px;
            height: 1em;
            background: #1a4a9a;
            margin-left: 2px;
            animation: blink 0.7s step-end infinite;
            vertical-align: text-bottom;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .message.thinking {
            align-self: flex-start;
            background: transparent;
            color: #1a4a9a;
            font-style: italic;
            font-size: 17px;
            padding: 8px 0;
            animation: pulse 1.2s infinite;
            max-width: 80%;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { opacity: 0.5; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1); }
            100% { opacity: 0.5; transform: scale(0.98); }
        }

        .input-area {
            border-top: 1.5px solid rgba(30, 60, 180, 0.12);
            padding-top: 10px;
            padding-bottom: 10px;
            margin-top: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .input-row {
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 850px;
        }

        .input-row input {
            flex: 1;
            padding: 14px 22px;
            border: 2px solid rgba(30, 60, 180, 0.12);
            border-radius: 32px;
            font-size: 18px;
            outline: none;
            background: rgba(255, 255, 255, 0.8);
            height: 54px;
            min-height: 54px;
            max-height: 54px;
            width: 100%;
        }

        .input-row input:focus {
            border-color: #1a4a9a;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(26, 74, 154, 0.08);
        }

        .input-row input::placeholder {
            color: #8a9aba;
            font-weight: 400;
            opacity: 0.7;
            font-size: 18px;
        }

        .input-row button {
            background: linear-gradient(135deg, #1a4a9a, #2a5aaa);
            border: none;
            border-radius: 32px;
            padding: 14px 34px;
            color: #ffffff;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            box-shadow: 0 4px 15px rgba(26, 74, 154, 0.2);
            height: 54px;
            min-height: 54px;
            max-height: 54px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .input-row button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(26, 74, 154, 0.3);
        }

        .disclaimer {
            margin-top: 8px;
            font-size: 13px;
            color: #6a7a9a;
            text-align: center;
            max-width: 850px;
            width: 100%;
            padding-top: 6px;
            border-top: 1px solid rgba(30, 60, 180, 0.04);
        }

        .searching-indicator {
            align-self: flex-start;
            background: transparent;
            color: #1a4a9a;
            font-size: 17px;
            padding: 8px 0;
            animation: pulse 1.2s infinite;
            max-width: 80%;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .searching-indicator .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2.5px solid rgba(26, 74, 154, 0.2);
            border-top: 2.5px solid #1a4a9a;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 700px) {
            .chat-container {
                padding: 16px 16px 12px;
            }
            .lang-selector {
                top: 12px;
                right: 16px;
                padding: 2px 4px;
                max-width: 200px;
            }
            .lang-selector button {
                font-size: 10px;
                padding: 2px 6px;
            }
            .mode-bar {
                padding-right: 100px;
            }
            .input-row {
                max-width: 100%;
            }
            .disclaimer {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="chat-container" id="app">
    <div class="lang-selector" id="langSelector">
        <button data-lang="ru" onclick="selectLanguage('ru')">🇷🇺 Рус</button>
        <button class="active" data-lang="en" onclick="selectLanguage('en')">🇬🇧 En</button>
        <button data-lang="zh" onclick="selectLanguage('zh')">🇨🇳 中文</button>
        <button data-lang="es" onclick="selectLanguage('es')">🇪🇸 Es</button>
        <button data-lang="ja" onclick="selectLanguage('ja')">🇯🇵 日本語</button>
    </div>

    <div class="mode-bar">
        <div class="mode-left">
            <span class="title" id="modeTitle">⚡ Быстрый режим</span>
            <button class="new-chat-icon" id="newChatBtn" title="Новый чат">
                <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.17L4 17.17V4h16v12z"/><path d="M7 9h10v2H7zm0 4h7v2H7z"/></svg>
            </button>
        </div>
        <div class="mode-buttons">
            <button class="mode-btn active" data-mode="quick" id="modeQuick">Быстрый</button>
            <button class="mode-btn" data-mode="expert" id="modeExpert">Эксперт</button>
            <button class="mode-btn" data-mode="recognize" id="modeRecognize">Распознавание</button>
        </div>
        <div class="checks">
            <label><input type="checkbox" id="deepThink"> <span id="labelDeepThink">Глубокое мышление</span></label>
            <label><input type="checkbox" id="smartSearch"> <span id="labelSmartSearch">Умный поиск</span></label>
        </div>
    </div>

    <div class="messages" id="messagesContainer"></div>

    <div class="input-area">
        <div class="input-row">
            <input type="text" id="messageInput" placeholder="Ask JaseChat...">
            <button id="sendBtn">Send</button>
        </div>
        <div class="disclaimer" id="disclaimerText">JaseChat tries but may make mistakes — verify important information</div>
    </div>
</div>

<script>
    // ===== ПЕРЕВОДЫ (5 ЯЗЫКОВ!) =====
    const translations = {
        ru: {
            modeTitle: '⚡ Быстрый режим',
            modeQuick: 'Быстрый',
            modeExpert: 'Эксперт',
            modeRecognize: 'Распознавание',
            newChat: 'Новый чат',
            deepThink: 'Глубокое мышление',
            smartSearch: 'Умный поиск',
            placeholder: 'Спросите у JaseChat...',
            send: 'Отправить',
            disclaimer: 'JaseChat старается, но может ошибаться — проверяйте важную информацию',
            thinking: 'JaseChat размышляет... 🤔',
            searching: 'Поиск информации в интернете... 🔍',
            sources: '📚 Источники:',
            welcome: 'Привет! 👋 Я JaseChat, твой виртуальный помощник. Спроси меня о чём угодно!'
        },
        en: {
            modeTitle: '⚡ Quick mode',
            modeQuick: 'Quick',
            modeExpert: 'Expert',
            modeRecognize: 'Recognition',
            newChat: 'New chat',
            deepThink: 'Deep thinking',
            smartSearch: 'Smart search',
            placeholder: 'Ask JaseChat...',
            send: 'Send',
            disclaimer: 'JaseChat tries but may make mistakes — verify important information',
            thinking: 'JaseChat is thinking... 🤔',
            searching: 'Searching the internet... 🔍',
            sources: '📚 Sources:',
            welcome: 'Hello! 👋 I\'m JaseChat, your virtual assistant. Ask me anything!'
        },
        zh: {
            modeTitle: '⚡ 快速模式',
            modeQuick: '快速',
            modeExpert: '专家',
            modeRecognize: '识别',
            newChat: '新聊天',
            deepThink: '深度思考',
            smartSearch: '智能搜索',
            placeholder: '向 JaseChat 提问...',
            send: '发送',
            disclaimer: 'JaseChat 尽力而为，但可能会出错 — 请核实重要信息',
            thinking: 'JaseChat 正在思考... 🤔',
            searching: '正在互联网上搜索... 🔍',
            sources: '📚 来源：',
            welcome: '你好！👋 我是 JaseChat，你的虚拟助手。请问有什么可以帮你？'
        },
        es: {
            modeTitle: '⚡ Modo rápido',
            modeQuick: 'Rápido',
            modeExpert: 'Experto',
            modeRecognize: 'Reconocimiento',
            newChat: 'Nuevo chat',
            deepThink: 'Pensamiento profundo',
            smartSearch: 'Búsqueda inteligente',
            placeholder: 'Pregunta a JaseChat...',
            send: 'Enviar',
            disclaimer: 'JaseChat se esfuerza, pero puede cometer errores — verifica la información importante',
            thinking: 'JaseChat está pensando... 🤔',
            searching: 'Buscando información en internet... 🔍',
            sources: '📚 Fuentes:',
            welcome: '¡Hola! 👋 Soy JaseChat, tu asistente virtual. ¡Pregúntame lo que quieras!'
        },
        ja: {
            modeTitle: '⚡ クイックモード',
            modeQuick: 'クイック',
            modeExpert: 'エキスパート',
            modeRecognize: '認識',
            newChat: '新しいチャット',
            deepThink: 'ディープシンキング',
            smartSearch: 'スマート検索',
            placeholder: 'JaseChatに質問する...',
            send: '送信',
            disclaimer: 'JaseChatは正確性を期しますが、間違えることがあります — 重要な情報はご自身でご確認ください',
            thinking: 'JaseChatは考えています... 🤔',
            searching: 'インターネットで情報を検索中... 🔍',
            sources: '📚 出典：',
            welcome: 'こんにちは！👋 JaseChatです。何でも聞いてください！'
        }
    };

    let currentLang = 'en';
    let hasWelcomeMessage = false;

    const messagesContainer = document.getElementById('messagesContainer');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const newChatBtn = document.getElementById('newChatBtn');
    const modeTitle = document.getElementById('modeTitle');
    const modeQuick = document.getElementById('modeQuick');
    const modeExpert = document.getElementById('modeExpert');
    const modeRecognize = document.getElementById('modeRecognize');
    const labelDeepThink = document.getElementById('labelDeepThink');
    const labelSmartSearch = document.getElementById('labelSmartSearch');
    const disclaimerText = document.getElementById('disclaimerText');
    const langBtns = document.querySelectorAll('.lang-selector button');

    function randomChoice(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

    function selectLanguage(lang) {
        const t = translations[lang];
        if (!t) return;
        currentLang = lang;
        modeTitle.textContent = t.modeTitle;
        modeQuick.textContent = t.modeQuick;
        modeExpert.textContent = t.modeExpert;
        modeRecognize.textContent = t.modeRecognize;
        labelDeepThink.textContent = t.deepThink;
        labelSmartSearch.textContent = t.smartSearch;
        messageInput.placeholder = t.placeholder;
        sendBtn.textContent = t.send;
        disclaimerText.textContent = t.disclaimer;
        newChatBtn.title = t.newChat;

        langBtns.forEach(btn => {
            btn.classList.remove('active');
            if (btn.dataset.lang === lang) {
                btn.classList.add('active');
            }
        });

        try { localStorage.setItem('jasechat_lang', lang); } catch(e) {}
        startNewChat();
    }

    // ===== ПОИСК =====
    function getEmulatedSources(query, lang) {
        const domains = {
            ru: [
                { title: 'Википедия', url: 'https://ru.wikipedia.org' },
                { title: 'РИА Новости', url: 'https://ria.ru' },
                { title: 'ТАСС', url: 'https://tass.ru' },
                { title: 'Коммерсантъ', url: 'https://kommersant.ru' },
                { title: 'РБК', url: 'https://rbc.ru' },
                { title: 'Интерфакс', url: 'https://interfax.ru' }
            ],
            en: [
                { title: 'Wikipedia', url: 'https://en.wikipedia.org' },
                { title: 'BBC News', url: 'https://bbc.com' },
                { title: 'Reuters', url: 'https://reuters.com' },
                { title: 'The Guardian', url: 'https://theguardian.com' },
                { title: 'CNN', url: 'https://cnn.com' }
            ],
            zh: [
                { title: '维基百科', url: 'https://zh.wikipedia.org' },
                { title: '百度百科', url: 'https://baike.baidu.com' },
                { title: '新浪', url: 'https://sina.com.cn' },
                { title: '人民网', url: 'https://people.com.cn' },
                { title: '新华网', url: 'https://xinhuanet.com' }
            ],
            es: [
                { title: 'Wikipedia', url: 'https://es.wikipedia.org' },
                { title: 'El País', url: 'https://elpais.com' },
                { title: 'BBC Mundo', url: 'https://bbc.com/mundo' },
                { title: 'CNN Español', url: 'https://cnnespanol.cnn.com' },
                { title: 'El Mundo', url: 'https://elmundo.es' }
            ],
            ja: [
                { title: 'Wikipedia', url: 'https://ja.wikipedia.org' },
                { title: 'NHK', url: 'https://nhk.or.jp' },
                { title: '朝日新聞', url: 'https://asahi.com' },
                { title: '読売新聞', url: 'https://yomiuri.co.jp' },
                { title: '毎日新聞', url: 'https://mainichi.jp' }
            ]
        };

        const langMap = lang === 'ru' ? 'ru' : lang === 'zh' ? 'zh' : lang === 'es' ? 'es' : lang === 'ja' ? 'ja' : 'en';
        const domainList = domains[langMap] || domains.en;

        const shuffled = [...domainList].sort(() => Math.random() - 0.5);
        const count = 2 + Math.floor(Math.random() * 3);
        const result = [];
        for (let i = 0; i < Math.min(count, shuffled.length); i++) {
            const domain = shuffled[i];
            result.push({
                title: domain.title,
                url: domain.url + '/search?q=' + encodeURIComponent(query)
            });
        }
        return result;
    }

    function getSearchKnowledge(query, lang) {
        const msg = query.toLowerCase().trim();

        if (lang === 'ru') {
            if (msg.includes('президент') || msg.includes('путин') || msg.includes('владимир')) {
                return randomChoice([

    function generateSearchResponse(query, lang, sources) {
        const knowledge = getSearchKnowledge(query, lang);
        const intros = {
            ru: ['Я нашёл информацию по вашему запросу! 📊 Вот что удалось выяснить:'],
            en: ['I found information on your request! 📊 Here\'s what I discovered:'],
            zh: ['我找到了关于您问题的信息！📊 以下是发现的内容：'],
            es: ['¡Encontré información sobre tu consulta! 📊 Esto es lo que pude averiguar:'],
            ja: ['あなたの質問に関する情報を見つけました！📊 以下がわかったことです：']
        };
        const langMap = lang === 'ru' ? 'ru' : lang === 'zh' ? 'zh' : lang === 'es' ? 'es' : lang === 'ja' ? 'ja' : 'en';
        const intro = randomChoice(intros[langMap] || intros.en);
        return intro + '\n\n' + knowledge;
    }

    async function searchAndGenerateResponse(query, lang) {
        const t = translations[lang];
        const searchDiv = document.createElement('div');
        searchDiv.className = 'searching-indicator';
        searchDiv.id = 'searchingIndicator';
        searchDiv.innerHTML = `<span class="spinner"></span> ${t.searching}`;
        messagesContainer.appendChild(searchDiv);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;

        await sleep(600 + Math.random() * 800);

        const sources = getEmulatedSources(query, lang);
        const indicator = document.getElementById('searchingIndicator');
        if (indicator) indicator.remove();

        const response = generateSearchResponse(query, lang, sources);
        return { text: response, sources: sources };
    }

                    '不用谢！😊 随时欢迎回来！',
                    '我的荣幸！🌟 需要帮助随时找我！'
                ]);
            }
            if (q.includes('再见') || q.includes('拜拜')) {
                return randomChoice([
                    '再见！👋 很高兴和你聊天。保重！',
                    '拜拜！😄 下次再来找我聊天！',
                    '保重！🌈 祝你一天愉快！'
                ]);
            }
            return randomChoice([
                '有趣的问题！🤔 让我们一起想想。',
                '好问题！💭 我准备好帮助你了。',
                '嗯，让我想想... 🤖 我准备和你讨论这个问题！'
            ]);
        }
    }

    async function getJaseChatResponseWithSearch(userMessage, lang) {
        const msg = userMessage.toLowerCase().trim();

        const searchTopics = [
            'политика', 'политик', 'президент', 'выборы', 'депутат',
            'война', 'военный', 'конфликт', 'санкция', 'экономика', 'кризис',
            'новости', 'сегодня', 'вчера', 'произошло', 'случилось',
            'закон', 'законодательство', 'суд',
            'международный', 'ООН', 'НАТО', 'ЕС',
            'коронавирус', 'ковид', 'вакцина', 'пандемия',
            'цены', 'инфляция', 'курс', 'доллар', 'евро',
            'погода', 'завтра', 'прогноз',
            'путин', 'владимир', 'россия', 'украина'
        ];

        const needsSearch = searchTopics.some(topic => msg.includes(topic));

        if (!needsSearch) {
            const response = getBaseResponse(msg, lang);
            return { text: response, sources: null };
        }

        return await searchAndGenerateResponse(userMessage, lang);
    }

    function getCurrentTime() {
        return new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    }

    function typeMessageSimple(text, wrapper, callback) {
        const msgDiv = wrapper.querySelector('.message');
        if (!msgDiv) return;

        msgDiv.innerHTML = '';
        
        let index = 0;
        const typingSpeed = 5;

        function typeNext() {
            if (index < text.length) {
                const charNode = document.createTextNode(text[index]);
                msgDiv.appendChild(charNode);
                index++;
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
                setTimeout(typeNext, typingSpeed);
            } else {
                const cursor = msgDiv.querySelector('.typing-cursor');
                if (cursor) cursor.remove();
                if (callback) callback();
            }
        }

        const cursor = document.createElement('span');
        cursor.className = 'typing-cursor';
        msgDiv.appendChild(cursor);

        setTimeout(typeNext, 200);
    }

    function addMessage(text, sender, shouldType = false, sources = null) {
        const wrapper = document.createElement('div');
        wrapper.className = `message-wrapper ${sender}`;
        const msgDiv = document.createElement('div');
        msgDiv.className = 'message';
        wrapper.appendChild(msgDiv);

        let displayText = text;

        if (sources && sources.length > 0) {
            const t = translations[currentLang];
            const sourceLinks = sources.map(s => 
                `<a href="${s.url}" target="_blank" class="source-link" rel="noopener noreferrer">
                    <span class="source-icon">🔗</span> ${s.title}
                </a>`
            ).join('');

            const sourcesHtml = `
                <div class="sources-section">
                    <div class="sources-label">📚 <span>${t.sources}</span></div>
                    <div class="sources-list">${sourceLinks}</div>
                </div>
            `;

            displayText = text + '\n\n---\n📚 ' + t.sources + ': ' + sources.map(s => s.title).join(', ');
        }

        const timeSpan = document.createElement('span');
        timeSpan.className = 'message-time';
        timeSpan.textContent = getCurrentTime();
        wrapper.appendChild(timeSpan);

        messagesContainer.appendChild(wrapper);

        if (shouldType && sender === 'jasechat') {
            typeMessageSimple(displayText, wrapper);
        } else {
            msgDiv.textContent = displayText;
        }

        if (sources && sources.length > 0) {
            const t = translations[currentLang];
            setTimeout(() => {
                const existingDiv = wrapper.querySelector('.message');
                if (existingDiv) {
                    const sourceLinks = sources.map(s => 
                        `<a href="${s.url}" target="_blank" class="source-link" rel="noopener noreferrer">
                            <span class="source-icon">🔗</span> ${s.title}
                        </a>`
                    ).join('');

                    const sourcesHtml = `
                        <div class="sources-section">
                            <div class="sources-label">📚 <span>${t.sources}</span></div>
                            <div class="sources-list">${sourceLinks}</div>
                        </div>
                    `;
                    existingDiv.innerHTML = text + '<br><br>' + sourcesHtml;
                }
            }, text.length * 5 + 500);
        }

        messagesContainer.scrollTop = messagesContainer.scrollHeight;
        return wrapper;
    }

    function addThinkingIndicator() {
        const t = translations[currentLang];
        const div = document.createElement('div');
        div.className = 'message thinking';
        div.id = 'thinkingIndicator';
        div.textContent = t.thinking;
        messagesContainer.appendChild(div);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function removeThinkingIndicator() {
        const el = document.getElementById('thinkingIndicator');
        if (el) el.remove();
    }

    async function simulateJaseChatResponse(userMessage) {
        addThinkingIndicator();
        await sleep(400 + Math.random() * 400);
        removeThinkingIndicator();

        const result = await getJaseChatResponseWithSearch(userMessage, currentLang);
        addMessage(result.text, 'jasechat', true, result.sources);
    }

    function sendMessage() {
        const text = messageInput.value.trim();
        if (!text) return;
        addMessage(text, 'user', false);
        messageInput.value = '';
        messageInput.focus();
        simulateJaseChatResponse(text);
    }

    function startNewChat() {
        messagesContainer.innerHTML = '';
        removeThinkingIndicator();
        hasWelcomeMessage = false;
        showWelcomeMessage();
        messageInput.focus();
    }

    function showWelcomeMessage() {
        if (!hasWelcomeMessage) {
            const t = translations[currentLang];
            addMessage(t.welcome, 'jasechat', true);
            hasWelcomeMessage = true;
        }
    }

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    newChatBtn.addEventListener('click', startNewChat);

    document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
        });
    });

    window.addEventListener('load', function() {
        let savedLang = null;
        try {
            const stored = localStorage.getItem('jasechat_lang');
            if (stored === 'ru' || stored === 'en' || stored === 'zh' || stored === 'es' || stored === 'ja') {
                savedLang = stored;
            }
        } catch(e) {}

        if (savedLang) {
            selectLanguage(savedLang);
        } else {
            selectLanguage('en');
        }

        messageInput.focus();
    });
</script>

</body>
